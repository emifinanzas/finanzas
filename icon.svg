<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- fondo blanco redondeado -->
  <rect width="512" height="512" rx="100" fill="#ffffff"/>
  <!-- moneda grande con símbolo $ -->
  <circle cx="200" cy="280" r="140" fill="#1D9E75"/>
  <circle cx="200" cy="280" r="115" fill="none" stroke="#ffffff" stroke-width="10" opacity=".3"/>
  <text x="200" y="330" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="130" font-weight="700" fill="#ffffff">$</text>
  <!-- flecha de crecimiento -->
  <polyline points="310,380 380,260 430,300 480,160" fill="none" stroke="#1D9E75" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- puntos de la línea -->
  <circle cx="380" cy="260" r="14" fill="#D85A30"/>
  <circle cx="430" cy="300" r="14" fill="#D85A30"/>
  <circle cx="480" cy="160" r="18" fill="#D85A30"/>
</svg>